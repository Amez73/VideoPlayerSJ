name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure stable debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # The release is updated in place, so GitHub keeps showing the date the
      # tag was first published. Put the real build time in the title/body so
      # the release card shows how fresh the APK actually is.
      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build · ${{ steps.meta.outputs.sha_short }} · ${{ steps.meta.outputs.built_at }}
          body: |
            Built ${{ steps.meta.outputs.built_at }} from commit ${{ github.sha }}

            Note: GitHub shows this release's original publish date, not the
            APK's upload time. Trust the timestamp above.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk

  desktop:
    # Runs after the APK job so the release it uploads into already exists and has its
    # title/body set; this job only adds files to it.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package desktop app
        run: ./gradlew :core:test :desktop:test :desktop:packageMsi :desktop:createDistributable

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/VideoPlayerSJ -DestinationPath VideoPlayerSJ-windows-portable.zip

      - name: Upload to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp desktop/build/compose/binaries/main/msi/*.msi VideoPlayerSJ-windows.msi
          gh release upload latest VideoPlayerSJ-windows.msi VideoPlayerSJ-windows-portable.zip --clobber
